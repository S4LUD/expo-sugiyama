plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.sugiyama'
version = '0.1.1'

android {
  namespace "expo.modules.sugiyama"
  defaultConfig {
    versionCode 1
    versionName "0.1.1"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20231013'
}
